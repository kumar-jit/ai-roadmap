name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          cat > assets/config.js <<EOF
          export const CONFIG = {
            sync: {
              enabled: true,
              firebaseConfig: {
                apiKey: "${FIREBASE_API_KEY}",
                authDomain: "${FIREBASE_AUTH_DOMAIN}",
                projectId: "${FIREBASE_PROJECT_ID}",
                storageBucket: "${FIREBASE_STORAGE_BUCKET}",
                messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
                appId: "${FIREBASE_APP_ID}",
              },
            },
          };
          EOF

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site — there is no build step, other than
          # the config.js rewrite above when Firebase secrets are configured.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
