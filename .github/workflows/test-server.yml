name: Test sync server

on:
  push:
    paths: ['server/**', '.github/workflows/test-server.yml']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt pytest httpx
      - run: pytest server/test_main.py -q
        env:
          ROADMAP_TOKEN: test
