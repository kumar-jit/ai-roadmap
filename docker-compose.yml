# Optional. Only needed if you want cross-device sync.
#
#   ROADMAP_TOKEN=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))") docker compose up -d
#
# The static site itself needs no server — open index.html or push it to Pages.

services:
  sync:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      ROADMAP_TOKEN: ${ROADMAP_TOKEN:?set ROADMAP_TOKEN in your shell or a .env file}
      ROADMAP_ORIGINS: ${ROADMAP_ORIGINS:-*}
    volumes:
      - progress:/data
    restart: unless-stopped

volumes:
  progress:
